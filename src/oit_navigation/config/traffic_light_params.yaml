/**:
  ros__parameters:
    # 1. YOLO モデル設定
    model_path: "/aiformula_machine/models/traffic_light.pt"
    device: "0"                   # "0" (CUDA, 実機 Jetson) / "cpu" / "mps" (Apple Silicon)
    imgsz: 640
    conf_threshold: 0.35
    iou_threshold: 0.45

    # 2. トピック設定
    image_topic: "/aiformula_sensing/zed_node/left_image/undistorted"   # 実機 ZED の非圧縮画像 (six_lane.launch.py と同じ)
    base_topic: "/aiformula_perception/traffic_light"
    visualization_topic: "/aiformula_visualization/traffic_light"
    publish_annotated_image: true

    # 3. 画面占有率 -> 距離 の逆算モデル
    #    occupancy = bbox_height_px / image_height_px
    #    distance  = distance_coeff / occupancy
    #    distance_coeff の決定は優先順: distance_coeff > focal_length_y > vertical_fov_deg
    real_height_m: 0.32          # 信号機の実寸縦幅 [m] (1辺32cmの正方形規格)

    # --- カメラ: 実機 ZED X の垂直焦点距離 (画像高さ 360px 基準) ---
    # 距離係数は real_height_m * focal_length_y / reference_image_height で、
    # focal_length_y と reference_image_height の「比」だけが効く (入力画像の解像度には依存しない)。
    # 確認: ros2 topic echo -f /aiformula_sensing/zed_node/left_image/camera_info --field k  (K[4] = fy)
    # 別解像度の fy を使う場合は reference_image_height もその画像高さに合わせること。
    # (旧値: mp4/shihou_video_2026_08_24_15_37_28.mp4 で 20m 実測逆算した 2238.5px @1080)
    focal_length_y: 248.7        # 垂直焦点距離 [px] (@ reference_image_height)
    reference_image_height: 360  # focal_length_y の基準画像高さ [px]

    vertical_fov_deg: 0.0        # focal_length_y<=0 のときの代替: 垂直画角 [deg] (ZED X HD1080 ~= 72.7)
    distance_coeff: 0.0          # >0 で距離係数 k [m] を直接指定 (既知距離で実測キャリブレーション時)
    min_occupancy: 0.0001        # ゼロ除算防止用の最小占有率
    max_valid_distance: 50.0     # 有効距離の上限 [m]
    smoothing_alpha: 0.7         # 指数平滑化 (EMA) 係数 (1.0 でフィルタ無効)
