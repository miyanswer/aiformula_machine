sensing:
  zedx:
    left_image:
      undistorted: "/aiformula_sensing/zed_node/left_image/undistorted"
      compressed: "/aiformula_sensing/zed_node/left_image/undistorted/compressed"   # JPEG (hardware_bringup の zed_image_compressor). 別 PC で記録・表示する用. web_simulator の IMAGE_TOPIC_NAME と同名
    right_image:
      undistorted: "/aiformula_sensing/zed_node/right_image/undistorted"
    imu: "/aiformula_sensing/zed_node/imu"
  input_can_data: "/aiformula_sensing/vehicle_info"
  vectornav:
    imu: "/aiformula_sensing/vectornav/imu"
    gnss: "/aiformula_sensing/vectornav/gnss"
  odometry:
    gyro: "/aiformula_sensing/gyro_odometry_publisher/odom"
    wheel: "/aiformula_sensing/wheel_odometry_publisher/odom"
    gnss: "/aiformula_sensing/gnss_odometry_publisher/odom"
    odom_imu: "/aiformula_sensing/odom_imu_localizer/odom"   # oit_navigation odom_imu_localizer (CAN + IMU)
  rear_potentiometer: "/aiformula_sensing/rear_potentiometer/yaw"

perception:
  mask_image: "/aiformula_perception/object_road_detector/mask_image"
  objects:
    bounding_box: "/aiformula_perception/object_road_detector/rect"
    info: "/aiformula_perception/object_publisher/object_info"
  annotated_mask_image: "/aiformula_perception/lane_line_publisher/annotated_mask_image"
  lane_detector:
    lane_lines: "/aiformula_perception/lane_detector/lane_lines"   # aiformula_interfaces/LaneLines
  lane_lines:
    left: "/aiformula_perception/lane_line_publisher/lane_lines/left"
    right: "/aiformula_perception/lane_line_publisher/lane_lines/right"
    center: "/aiformula_perception/lane_line_publisher/lane_lines/center"
  traffic_light:
    nearest_distance: "/aiformula_perception/traffic_light/nearest_distance"
    red_distance: "/aiformula_perception/traffic_light/red_distance"
    green_distance: "/aiformula_perception/traffic_light/green_distance"
    status: "/aiformula_perception/traffic_light/status"
  cone_detector:
    cones: "/aiformula_perception/cone_detector/cones"     # geometry_msgs/PoseArray (base_link)
    status: "/aiformula_perception/cone_detector/status"   # JSON (x, y, 距離, 信頼度, bbox)

control:
  joy:
    gamepad: "/aiformula_control/gamepad/joy"
  speed_command:
    gamepad: "/aiformula_control/gamepad/cmd_vel"
    handle_controller:
      normal: "/aiformula_control/handle_controller/cmd_vel"
      coasting: "/aiformula_control/handle_controller/cmd_vel/coasting"
    mpc: "/aiformula_control/extremum_seeking_mpc/cmd_vel"
    multiplexed: "/aiformula_control/twist_mux/cmd_vel"
  twist_mux_lock:
    all: "/aiformula_control/twist_mux/all/lock"
    handle_controller: "/aiformula_control/twist_mux/handle_controller/lock"
    gamepad: "/aiformula_control/twist_mux/gamepad/lock"
  output_can_data: "/aiformula_control/motor_controller/reference_signal"
  lane_navigator_status: "/aiformula_control/lane_tracker/status"   # JSON (LaneNavigator.status())
  six_lane_planner:
    status: "/aiformula_control/six_lane_planner/status"              # JSON (判断 + 日本語の理由 'explain')
    lane_reseed: "/aiformula_control/six_lane_planner/lane_reseed"
  traffic_light_stop_status: "/aiformula_control/traffic_light_stop/status"   # JSON (赤信号停止の状態)

visualization:
  annotated_image: "/aiformula_visualization/object_road_detector/annotated_image"
  aiformula_pilot: "/aiformula_visualization/zed/left_image/compressed"
  unfiltered_object: "/aiformula_visualization/object_publisher/unfiltered_object"
  traffic_light_annotated_image: "/aiformula_visualization/traffic_light/annotated_image"
  lane_detector_annotated_image: "/aiformula_visualization/lane_detector/annotated_image"
  lane_navigator:
    left_boundary: "/aiformula_visualization/lane_navigator/left_boundary"
    right_boundary: "/aiformula_visualization/lane_navigator/right_boundary"
    target_trajectory: "/aiformula_visualization/target_trajectory"
    panel: "/aiformula_visualization/lane_navigator/panel"            # 判断パネル画像 (日本語)
    panel_compressed: "/aiformula_visualization/lane_navigator/panel/compressed"   # 同 JPEG (別 PC で記録・表示する用)
    markers: "/aiformula_visualization/lane_navigator/markers"
  six_lane_planner:
    target_path: "/aiformula_visualization/six_lane_planner/target_path"
    markers: "/aiformula_visualization/six_lane_planner/markers"       # 仮想6レーン・目標レーン・確率
    panel: "/aiformula_visualization/six_lane_planner/panel"           # 判断パネル画像 (俯瞰図 + 日本語の理由)
    panel_compressed: "/aiformula_visualization/six_lane_planner/panel/compressed"   # 同 JPEG (別 PC で記録・表示する用)
  cone_detector:
    markers: "/aiformula_visualization/cone_detector/markers"
    annotated_image: "/aiformula_visualization/cone_detector/annotated_image"
  traffic_light_stop_markers: "/aiformula_visualization/traffic_light_stop/markers"
