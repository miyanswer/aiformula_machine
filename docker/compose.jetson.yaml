services:
  aiformula_machine:
    build:
      dockerfile: docker/Dockerfile.jetson
    runtime: nvidia
    # can0 (SocketCAN) はホストのネットワーク名前空間にしか存在しないため、
    # ブリッジネットワークのままだと ros2_socketcan が "No such device" で
    # 起動できない。ROS 2 DDS / rosbridge(9090) も LAN から直接届くよう
    # ホストネットワークを使う (compose.yaml の ports: はこのモードでは
    # Docker により無視され、警告が出るだけ)。
    network_mode: host
    # compose.yaml の hostname (aiformula-machine) はホストの /etc/hosts に
    # 無いため、sudo が毎回 "unable to resolve host" を出す。
    extra_hosts:
      - "aiformula-machine:127.0.1.1"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # USB 機器 (VectorNav /dev/ttyUSB0, Kvaser CAN, ゲームパッド /dev/input/js*)
      # はコンテナ起動後に抜き差しされることがあるため /dev ごと共有する。
      - /dev:/dev
      # kvaser_usb 等のカーネルモジュールを can_bringup.sh の modprobe で
      # ロードできるようにする。
      - /lib/modules:/lib/modules:ro
      # ---- ZED X (GMSL / ZED Link Duo) ----
      # Stereolabs 公式の「ZED X を Docker で使う」手順と同じマウント。
      # カメラ本体はホストの zed_x_daemon + nvargus-daemon が握っており、
      # コンテナ内 SDK は argus ソケット経由でフレームを受け取る。
      # nvargus-daemon は再起動のたびに /tmp/argus_socket を作り直す (別 inode)
      # ため、ソケットファイル単体を bind mount すると再起動後に古い inode を
      # 指したまま "Connecting to nvargus-daemon failed: Connection refused"
      # になる。ホストの /tmp をディレクトリごと /host_tmp にマウントし、
      # docker/entrypoint.sh で /tmp/argus_socket -> /host_tmp/argus_socket の
      # シンボリックリンクを張る (connect 毎にパス解決されるので常に最新)。
      - /tmp:/host_tmp
      - /var/nvidia/nvcam/settings:/var/nvidia/nvcam/settings
      - /etc/systemd/system/zed_x_daemon.service:/etc/systemd/system/zed_x_daemon.service:ro
      # キャリブレーションファイルと AI モデルはホストの SDK と共有
      # (毎回のダウンロード/TensorRT 最適化を避ける)。
      - /usr/local/zed/settings:/usr/local/zed/settings
      - /usr/local/zed/resources:/usr/local/zed/resources
      # SDK が実行時に L4T バージョンを確認するため、ホストの実際の値を見せる。
      - /etc/nv_tegra_release:/etc/nv_tegra_release:ro
